<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="rgba(79,195,247,0.1)"/>
  <circle cx="1100" cy="530" r="120" fill="rgba(79,195,247,0.08)"/>
  
  <!-- Book icon -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="72" fill="#4fc3f7" text-anchor="middle">📖</text>
  
  <!-- Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">GEO Encyclopedia</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="28" fill="#90caf9" text-anchor="middle">Generative Engine Optimization Encyclopedia</text>
  
  <!-- Description -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="24" fill="#b0bec5" text-anchor="middle">49 In-Depth Articles · 9 Chapters + Community</text>
  
  <!-- Badge -->
  <rect x="400" y="470" width="400" height="50" rx="25" fill="rgba(79,195,247,0.2)"/>
  <text x="600" y="502" font-family="Arial, sans-serif" font-size="20" fill="#4fc3f7" text-anchor="middle">🤖 Open to AI Crawlers · Welcome to Cite</text>
  
  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="#666" text-anchor="middle">geo010.com</text>
</svg>
